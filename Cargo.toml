[package]
name = "handy"
version = "0.7.5"
description = "Speech-to-text for GNOME/Wayland via IBus"
authors = ["cjpais", "rohithmahesh"]
edition = "2021"
license = "MIT"
default-run = "handy"

[[bin]]
name = "handy"
path = "src/main.rs"

[[bin]]
name = "ibus-handy-engine"
path = "src/bin/ibus-handy-engine.rs"

[profile.dev]
incremental = true

[lib]
name = "handy_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
glib-build-tools = "0.20"
pkg-config = "0.3"
cc = "1.0"

[dependencies]
# GTK4 / Libadwaita
gtk4 = "0.9"
libadwaita = "0.7"
glib = "0.20"
gio = "0.20"
pango = "0.20"

# Audio
cpal = "0.16.0"
rodio = { version = "0.20", default-features = false, features = ["wav"] }
rubato = "0.16.2"
hound = "3.5.1"
gstreamer = "0.23"
gstreamer-play = "0.23"

# Async / HTTP
tokio = { version = "1.43.0", features = ["rt-multi-thread", "macros", "sync", "time"] }
reqwest = { version = "0.12", features = ["json", "stream"] }
futures-util = "0.3"

# Transcription
transcribe-rs = { version = "0.2.3", features = ["whisper", "parakeet", "moonshine", "sense_voice"] }
vad-rs = { git = "https://github.com/cjpais/vad-rs", default-features = false }

# Input
enigo = "0.6.1"
rdev = { git = "https://github.com/rustdesk-org/rdev" }

# D-Bus for IBus
zbus = "4.4"

# Database
rusqlite = { version = "0.37", features = ["bundled"] }
rusqlite_migration = "2.3"

# Utils
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1.0.95"
log = "0.4.25"
env_logger = "0.11"
env_filter = "0.1.0"
chrono = { version = "0.4", features = ["serde"] }
regex = "1"
strsim = "0.11.0"
natural = "0.5.0"
rustfft = "6.4.0"
once_cell = "1"
tar = "0.4.44"
flate2 = "1.0"
ferrous-opencc = "0.2.3"
dirs = "6"

# Portal for file opening
ashpd = "0.10"

# CLI
clap = { version = "4", features = ["derive"] }
clap-verbosity-flag = "3"

# IBus bindings
ibus-sys = { path = "ibus-sys" }

[target.'cfg(unix)'.dependencies]
signal-hook = "0.3"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
